# Малый дизайн для золотых эталонов (tests/test_golden.py, тикет T8).
# Полная копия configs/experiment.yaml с отличиями только в сетке и A/A:
# одна ячейка 2000 клиентов (repeats: 1) и 200 прогонов A/A вместо 1000 —
# эталонный прогон обязан укладываться в минуты. Дизайн, сплит и доля
# отложенной выборки — как в боевом конфиге.

seed: 42

design:
  alpha: 0.05
  power: 0.80
  base_rate: 0.48
  mde_absolute: 0.0125
  alternative: two-sided

# Одна ячейка вместо сетки 3 × 5: золотой тест сверяет воспроизводимость
# чисел, а не свойства сетки дизайнов.
grid:
  n_total: [2000]
  control_share: [0.5]
  effect_scale: [1.0]
  repeats: 1

split:
  method: bernoulli
  stratify_by: null

validation:
  aa_test: true
  aa_runs: 200               # эталон: меньше прогонов A/A — быстрее, точность хватает
  holdout_share: 0.3         # метрики считаются ТОЛЬКО на отложенной части
