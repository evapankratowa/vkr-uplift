# Заполненный вход для этапа 7 — условная оптимизация отбора.
# Шаблон: docs/cost_inputs_template.yaml
# Заполнено ТОЛЬКО по открытым источникам (прайсы агрегаторов рассылок, отраслевые
# исследования, публикации СМИ). Рабочие данные и внутренние цифры М2 не использовались.
#
# КАК ЧИТАТЬ ЭТОТ ФАЙЛ
#   Открытого прайса «цена контакта для коммерческого банка, сегмент физлиц» не
#   существует ни по одному каналу: банки закупают по индивидуальным договорам, а
#   операторы и агрегаторы публикуют либо розничные тарифы для малых объёмов, либо
#   «цена по запросу». Поэтому по каждому каналу взята ОДНА опорная публикация,
#   дающая вилку, а остальные найденные цифры вынесены в note как перекрёстная
#   проверка. Всё, что посчитано мной, а не взято из источника дословно, помечено
#   словом «расчёт».

meta:
  filled_at: 2026-09-19
  currency: RUB
  vat_included: false
  # ^ НДС. Опорные источники (Altcraft, vc.ru) статус НДС не указывают — принято
  #   «без НДС» как консервативное: при пересчёте в цены с НДС стоимость контакта
  #   вырастет на 20%, то есть порог uplift для канала станет строже, а не мягче.
  #   Розничные прайсы агрегаторов (sms.ru, smsc.ru, SIGMA messaging, i-Digital)
  #   публикуются С НДС — они в note идут как проверка порядка величины, не как
  #   основание для цифры. Если глава 3 считает в ценах с НДС — умножить на 1,2.
  price_level: 2026-06
  # ^ Опорные публикации датированы 2025-10 … 2026-06; точная дата каждой — в
  #   source_date канала. Единый уровень цен по файлу условен, разброс по датам
  #   меньше, чем разброс внутри вилок.

channels:
  - name: push
    cost_per_contact_rub: 0.125
    cost_range_rub: [0.03, 0.15]
    what_is_included: >-
      только отправка push через внешнюю SaaS-платформу рассылок. НЕ входят:
      абонентская плата платформы, разработка и поддержка SDK в мобильном
      приложении, каскад в SMS при недоставке (он тарифицируется как SMS)
    deliverability: 0.80
    source_url: https://altcraft.com/ru/blog/iz-chego-skladyvaetsya-byudzhet-rassylki
    source_title: "Altcraft. Сколько стоит рассылка: email, SMS, push и мессенджеры"
    source_date: 2025-10-30
    grade: C
    note: >-
      ЦИФРА. Altcraft даёт 0,10–0,15 ₽ за push на SaaS-платформах; точечное
      значение 0,125 ₽ — середина этой вилки (расчёт). Нижняя граница вилки
      0,03 ₽ — официальный прайс SIGMA messaging, «от 3 копеек / уведомление»
      (https://sigmasms.ru/mobile-push/, грейд A, цена с НДС, минимальный пакет
      не опубликован).
      ПРОВЕРКА ПОРЯДКА. Mindbox тарифицирует push подпиской на модуль плюс
      0,001 ₽ за запись сверх 40 млн, базовый модуль от 15 000 ₽/мес без НДС
      (https://mindbox.ru/documents/pricing/, грейд A) — то есть при банковских
      объёмах переменная часть стремится к нулю, а стоимость сидит в абонплате.
      edna и i-Digital цену не публикуют, только «по запросу».
      ГЛАВНАЯ ОГОВОРКА — РАЗВИЛКА ДЛЯ ГЛАВЫ 3. Приведённые 0,03–0,15 ₽ — это
      цена ВНЕШНЕЙ платформы. Банк, отправляющий push через СОБСТВЕННОЕ
      мобильное приложение, платит только за разработку и инфраструктуру:
      Frank Media прямо пишет, что такие push «бесплатны, кроме затрат на
      разработку» (https://frankmedia.ru/46941, 2021-07-07, грейд C). При
      ценности отклика 120 ₽ обе трактовки дают порог uplift меньше 0,13%,
      то есть на отбор push эта развилка почти не влияет — но в тексте главы
      её надо назвать явно.
      ДОСТАВЛЯЕМОСТЬ. 0,80 — не из Altcraft. Источники: i-Digital по каналу
      «push через приложение Т-Банка» заявляет 80% доходимости
      (https://i-dgtl.ru/produkty-i-uslugi/push-cherez-t-bank/, грейд A);
      i-Digital по собственной push-платформе — «от 85%»
      (https://i-dgtl.ru/produkty-i-uslugi/push/); edna — 96%
      (https://edna.ru/push/). Все три — заявления вендоров, не замеры, грейд A
      только по факту публикации на официальном сайте. Косвенное подтверждение
      порядка: ВТБ сообщал, что push подключили 80% пользователей приложения
      (Frank Media, 2021). Для банка «доставляемость push» фактически равна
      доле клиентов с установленным приложением и разрешёнными уведомлениями,
      а это внутренняя величина — 0,80 здесь только ориентир.

  - name: sms
    cost_per_contact_rub: 5.75
    cost_range_rub: [5.5, 6.0]
    what_is_included: >-
      отправка одного рекламного SMS через агрегатора. НЕ входят: абонентская
      плата за буквенное имя отправителя (1000 ₽/мес у МТС, 2542 ₽/мес у
      Мегафона, 2080–3000 ₽/мес по разным агрегаторам), плата за регистрацию
      шаблонов, доставка не гарантирована и отдельно не тарифицируется
    deliverability:
    source_url: https://altcraft.com/ru/blog/iz-chego-skladyvaetsya-byudzhet-rassylki
    source_title: "Altcraft. Сколько стоит рассылка: email, SMS, push и мессенджеры"
    source_date: 2025-10-30
    grade: C
    note: >-
      ЦИФРА. Altcraft (2025-10): рекламные SMS 5,5–6 ₽, сервисные 3–4 ₽. Взяты
      рекламные, потому что кампания в главе 3 — маркетинговая, а не сервисная;
      точечное значение 5,75 ₽ — середина вилки (расчёт).
      БАНКОВСКИЙ ЯКОРЬ (важнее всего остального в этой строке). Frank RG,
      «Mobile. 2025. Benchmark. Исследование эффективности смс-коммуникации»
      (https://frankrg.com/wp-content/uploads/2025/05/f751ece28ef1.pdf, май 2025,
      грейд B) — единственный найденный источник именно по банкам: 7 банков,
      6 из них из ТОП-15. Средняя цена SMS для банка: 1,3 ₽ (2021) → 1,7 (2022)
      → 2,0 (2023) → 2,4 ₽ (2024, +26,3% г/г). По типам за 2024:
      транзакционные 1,2 ₽, авторизационные 1,9 ₽, сервисные 2,1 ₽,
      РЕКЛАМНЫЕ 3,2 ₽. Там же: в I квартале 2025 часть операторов подняла цены
      в среднем на 25%. Ассоциация банков России (2026-08-05, через
      «Интерфакс-Финмаркет», https://www.finmarket.ru/main/article/6679830,
      грейд C) сообщает о росте тарифов операторов на 25–50% с начала 2026 года.
      Индексация (расчёт, не из источника): 3,2 × 1,25 = 4,0 ₽ на конец 2025;
      4,0 × (1,25…1,50) = 5,0–6,0 ₽ на середину 2026. Это сходится с вилкой
      Altcraft, поэтому 5,5–6 ₽ принята как рабочая. Если в главе 3 нужна
      цифра, взятая из источника дословно, а не проиндексированная, — брать
      3,2 ₽ и указывать уровень цен 2024.
      ПРОВЕРКА ПОРЯДКА по розничным прайсам (все с НДС, малые объёмы, поэтому
      выше оптовых): sms.ru — от 8,36–8,50 ₽ (https://sms.ru/price, A);
      smsc.ru — 9,80 ₽ на минимальном плане со скидками за объём
      (https://smsc.ru/tariffs/, A); SIGMA messaging — 6,59–10,19 ₽ по
      операторам (https://sigmasms.ru/tariff/, A); i-Digital SMS Promo —
      10,07 ₽ (https://i-dgtl.ru/prices/, A); P1SMS — 2,92 ₽ с цифрового имени
      и 6,67–12,50 ₽ с общего, без НДС (https://p1sms.ru/ceny-na-sms-rassylki, A).
      Разброс 2,9–12,5 ₽ объясняется типом имени отправителя и объёмом, не
      разницей в качестве канала.
      СТРУКТУРА ТАРИФОВ МЕНЯЕТСЯ. С осени 2025 Билайн и Мегафон перешли на
      ПАКЕТНУЮ тарификацию — плата за уникального абонента в месяц, а не за
      сообщение (AdIndex, 2025-11-13,
      https://adindex.ru/news/marketing/2025/11/13/339078.phtml, грейд C:
      например, Мегафон — 30 ₽ за 1–5 рекламных SMS на абонента в месяц, 6 ₽ за
      штуку начиная с 21-го). При такой сетке линейная модель «цена × число
      контактов» перестаёт быть точной: предельная стоимость 11-го сообщения
      одному клиенту ниже, чем первого. Для главы 3 это ограничение модели, его
      стоит оговорить; в конфиге ограничение max_contacts_per_month = 4 держит
      расчёт в зоне, где линейное приближение ещё работает.
      ДОСТАВЛЯЕМОСТЬ оставлена пустой: ни один из найденных открытых источников
      не даёт долю доставленных SMS.

  - name: call
    cost_per_contact_rub: 45
    cost_range_rub: [25, 60]
    what_is_included: >-
      работа оператора аутсорсингового колл-центра за один состоявшийся
      разговор. НЕ входят: телефонный трафик (1–3 ₽/мин), разовая подготовка
      проекта и скриптов (5–30 тыс. ₽), администрирование (10–50 тыс. ₽/мес),
      личный кабинет и интеграция с CRM (2–10 тыс. ₽). Минимальный бюджет
      проекта у подрядчиков — от 39–45 тыс. ₽/мес
    deliverability: 0.50
    source_url: https://vc.ru/marketing/2168127-uslugi-koll-tsentrov-2025
    source_title: "Услуги колл-центров в 2025 году: цифры и реальные примеры (vc.ru)"
    source_date: 2025-08-19
    grade: C
    note: >-
      ЦИФРА. Прямого прайса «цена результативного контакта» нет ни у одного
      подрядчика: все публикуют минуты или пакеты, результат считают
      индивидуально. Опорная публикация даёт 40–60 ₽ за звонок как среднюю по
      рынку и 25 ₽ как предложение автора — отсюда вилка 25–60 ₽ и точечное
      45 ₽ (расчёт: середина рыночной вилки 40–60).
      ПЕРЕКРЁСТНАЯ ПРОВЕРКА ЧЕРЕЗ МИНУТЫ (расчёт). Исходящие 10–22 ₽/мин, у OCC
      Group собственный тариф 15 ₽/мин, аренда оператора 210–350 ₽/час
      (https://occ-group.ru/blog/stoimost-autsorsinga-koll-tsentra-v-2026-godu,
      2026-05-28, грейд C). Kolocall: пакет 39 000 ₽/мес за 1500 минут = 26 ₽/мин
      в пакете, 19 ₽/мин сверх пакета, плюс 1 ₽ за каждую попытку вызова
      (https://kolocall.com/price/, грейд A). NovaContact: пакеты
      106 000 ₽ / 3000 мин и 429 000 ₽ / 12 000 мин = 35–36 ₽/мин
      (https://novacontact.ru/price, грейд A). При разговоре 2 минуты и
      15 ₽/мин выходит 30 ₽ за разговор плюс ~2 ₽ телефонии плюс время на
      недозвоны — то есть 35–45 ₽. Вилка из опорного источника подтверждается.
      АЛЬТЕРНАТИВА — РОБОТ. Автообзвон голосовым роботом стоит 4–7 ₽ за контакт
      (OCC Group, там же). Если глава 3 рассматривает обзвон как реально
      применимый канал, а не как заведомо дорогой, его надо считать отдельным
      каналом: разница с живым оператором — почти порядок.
      ДОЗВОН. 0,50 — не из опорного источника. Skorozvon приводит нормальную
      контактность 40–60% по тёплой базе и 20–35% по холодной, а также
      оговаривает, что в холодных базах до 30% «успешных» соединений
      приходятся на автоответчики
      (https://skorozvon.ru/articles/6-prichin-nizkoj-dozvanivaemosti-pri-obzvone,
      2026-04-24, обновлено 2026-07-21, грейд C). Клиентская база банка — тёплая,
      взята середина 40–60%.
      ЧТО ЭТО ЗНАЧИТ ДЛЯ ОТБОРА (расчёт). При ценности отклика 120 ₽ звонок
      окупается только на клиентах с uplift > 45/120 = 0,375, то есть 37,5 п.п.
      Таких сегментов в задаче почти наверняка нет, и канал «звонок» выпадет
      из отбора на первом же шаге. Это содержательный результат, а не дефект
      данных: при такой ценности отклика обзвон экономически несостоятелен.
      Для сравнения: SMS требует uplift > 4,8 п.п., push — > 0,10 п.п.

# Внешние ориентиры для проверки правдоподобия ценности отклика (120 ₽ —
# медиана невыплаченного банковского кэшбэка за три месяца).
# Прямой открытой оценки «средняя ставка кэшбэка по рынку в процентах» найти не
# удалось: ни ВТБ, ни Банки.ру её не публикуют. Ниже — то, что есть.
benchmarks:
  - what: Объём выплат кэшбэка банками РФ за I полугодие 2026 года
    value: 200
    units: млрд ₽
    source_url: https://t-j.ru/news/cashback-minus-10/
    source_title: "Выплаты кэшбэка банками сократились на 10% за год: исследование аналитиков ВТБ"
    source_date: 2026-07-27
    grade: C

  - what: >-
      Прогноз выплат кэшбэка банками РФ за весь 2026 год (ВТБ; методику оценки
      банк не раскрыл — использовать только как порядок величины)
    value: 473
    units: млрд ₽
    source_url: https://finance.mail.ru/article/smi-banki-urezali-keshbek-rossiyanam-v-pervom-polugodii-2026-goda-69219661/
    source_title: "Выплаты кешбэка в 2026 году могут достичь 473 млрд рублей: прогноз ВТБ (РБК со ссылкой на ВТБ)"
    source_date: 2026-07-27
    grade: C

  - what: >-
      Наиболее частый месячный лимит рублёвого кэшбэка по карте — 3000 ₽/мес
      (такой потолок у 46–55% карт с кэшбэком рублями). Ориентир сверху для
      медианы 120 ₽ за три месяца: потолок выше медианы примерно в 75 раз,
      то есть ограничение программы отклик не срезает
    value: 3000
    units: ₽ в месяц
    source_url: https://finance.mail.ru/article/stalo-izvestno-kak-banki-nachislyayut-keshbek-za-pokupki-po-kartam-65577811/
    source_title: "Как банки рассчитывают и начисляют кешбэк клиентам: исследование Банки.ру"
    source_date: 2025-04-06
    grade: B

  - what: >-
      Доля карт, по которым накопленные баллы можно потратить у партнёров банка
      (это доля КАРТ с такой опцией, а НЕ доля партнёрских покупок в обороте —
      последней в открытых источниках найти не удалось)
    value: 0.70
    units: доля карт, 0–1
    source_url: https://finance.mail.ru/article/stalo-izvestno-kak-banki-nachislyayut-keshbek-za-pokupki-po-kartam-65577811/
    source_title: "Как банки рассчитывают и начисляют кешбэк клиентам: исследование Банки.ру"
    source_date: 2025-04-06
    grade: B
