# Вход для этапа 7 — условная оптимизация отбора.
# Заполняется ТОЛЬКО по открытым источникам: прайсы операторов и агрегаторов рассылок,
# отраслевые обзоры. Рабочие данные и внутренние цифры любого работодателя не
# используются и в работу не попадают.
#
# Что с этим будет дальше:
#   1. значения cost_per_contact_rub переносятся в configs/campaign.yaml
#   2. блок sources целиком уходит в DATA_PASSPORT.md, раздел ЭКОНОМИКА
#   3. каждая цифра в главе 3 ссылается на строку отсюда
#
# Пустые поля оставлять пустыми, а не выдумывать. Незаполненный канал просто
# не участвует в отборе.

meta:
  filled_at:            # YYYY-MM-DD, дата заполнения
  currency: RUB
  vat_included:         # true / false — указать явно: прайсы операторов часто без НДС
  price_level:          # YYYY-MM, на какой месяц цены

channels:
  - name: push
    cost_per_contact_rub:      # число, стоимость одного отправленного контакта
    cost_range_rub: []         # [min, max], если источник даёт вилку
    what_is_included:          # что входит в цену: отправка, платформа, доставка
    deliverability:            # доля доставленных, 0–1; пусто, если источник не даёт
    source_url:
    source_title:
    source_date:               # YYYY-MM-DD, дата публикации источника
    grade:                     # A — официальный прайс оператора или агрегатора
                               # B — отраслевой обзор, исследование рынка
                               # C — статья в СМИ или блог компании
                               # D — форум, пост без подтверждения
    note:                      # оговорки: объёмные скидки, минимальный пакет, регион

  - name: sms
    cost_per_contact_rub:
    cost_range_rub: []
    what_is_included:
    deliverability:
    source_url:
    source_title:
    source_date:
    grade:
    note:

  - name: call
    cost_per_contact_rub:      # стоимость результативного контакта, не минуты
    cost_range_rub: []
    what_is_included:          # оператор, телефония, CRM — что именно посчитано
    deliverability:            # доля дозвонов
    source_url:
    source_title:
    source_date:
    grade:
    note:

# Необязательный блок: внешние ориентиры, чтобы проверить правдоподобие ценности
# отклика (у нас она из данных — медиана невыплаченного банковского кэшбэка, 120 ₽
# за три месяца). Если найдётся открытая оценка средней ставки кэшбэка или доли
# партнёрских покупок по рынку — она сюда.
benchmarks:
  - what:                      # что именно за величина
    value:
    units:
    source_url:
    source_title:
    source_date:
    grade:
