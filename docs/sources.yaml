# Реестр внешних источников проекта — единственное место, где они описаны.
# На него ссылаются PLAN.md, DECISIONS.md, DATA_PASSPORT.md и главы ВКР: в тексте
# указывается id, полное описание берётся отсюда.
#
# ОФОРМЛЕНИЕ. Поле gost заполнено по ГОСТ Р 7.0.100–2018 (описание) и
# ГОСТ Р 7.0.5–2008 (ссылки), методичка библиотеки ИЦО РАНХиГС —
# archive/ВКР/-РАНХ и ГС- составление списка литературы к ВКР.pdf
# Правила, которые чаще всего нарушают:
#   - 1–3 автора: описание начинается с фамилии первого; 4 и более — с заглавия,
#     за косой чертой перечисляются все четыре, при пяти и более — трое и [и др.];
#   - размер тире в «точка пробел тире» . – единый во всём списке;
#   - [Текст] и [Электронный ресурс] больше не используются;
#   - для сетевых ресурсов обязательны URL и дата обращения;
#   - иностранные источники образуют отдельный алфавитный ряд ПОСЛЕ русских,
#     нумерация при этом сквозная. Поле lang нужно для этой сортировки.
#
# ГРЕЙД НАДЁЖНОСТИ (наш внутренний, в список литературы не идёт):
#   A — рецензируемая публикация, официальный прайс или документация;
#   B — отраслевое исследование, бенчмарк, заметка личной базы знаний;
#   C — публикация в СМИ, корпоративный блог;
#   D — форум, пост без подтверждения. Источники грейда D в работу не берём.
#
# used_in — где источник уже используется. Заполняется по ходу, чтобы в конце
# было видно, какие источники реально сработали, а какие лежат мёртвым грузом.

meta:
  updated: 2026-09-19
  standard: "ГОСТ Р 7.0.100–2018, ГОСТ Р 7.0.5–2008"
  count_target: "50–60 источников в списке литературы ВКР (требование Положения о ГИА)"

